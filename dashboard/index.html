<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatTrak™ · CS2 Chat Leaderboards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="stattrak-badge">
            <span class="stattrak-icon">⚡</span>
            <span class="stattrak-text">ChatTrak<sup>™</sup></span>
          </div>
          <h1>Chat Leaderboards</h1>
          <p class="subtitle">In-game message analytics · live stat counters</p>
        </div>
        <div class="meta-panel">
          <span class="meta-label">Last sync</span>
          <span class="meta-value" id="meta">—</span>
        </div>
      </header>

      <nav class="tabs" id="tabs"></nav>

      <section class="controls panel">
        <label class="control">
          <span>Sort by</span>
          <select id="sortBy">
            <option value="match_count">Raw count</option>
            <option value="rate_per_message">Per message rate</option>
            <option value="total_messages">Total messages</option>
          </select>
        </label>
        <label class="control">
          <span>Order</span>
          <select id="sortDir">
            <option value="desc">High → low</option>
            <option value="asc">Low → high</option>
          </select>
        </label>
        <label class="control">
          <span>Min messages</span>
          <input id="minMessages" type="number" min="0" value="0" />
        </label>
        <label class="control control-wide">
          <span>Search player</span>
          <input id="search" type="search" placeholder="Steam ID or profile URL" />
        </label>
      </section>

      <section class="summary" id="summary"></section>

      <section class="leaderboard panel">
        <div class="panel-header">
          <span class="panel-tag">// rankings</span>
          <span class="panel-title" id="categoryTitle">—</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Operative</th>
                <th>Msgs</th>
                <th>StatTrak count</th>
                <th>Rate</th>
                <th>Intel</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
